schema_version: 2
dataset: dataset_b
model: realmlp
model_version: realmlp_v1
status: final_locked_configuration
is_final_configuration: true
hyperparameter_search: false

contracts:
  feature: dataset_b/feature_set_v1.yaml
  split: dataset_b/split_v1.yaml
  preprocessing_version: dataset_b_neural_preprocessing_v1
  raw_feature_count: 15
  semantic_feature_count: 19

backend:
  package: pytabkit
  package_version: "1.7.3"
  estimator_class: pytabkit.models.sklearn.sklearn_interfaces.RealMLP_TD_Classifier

estimator_parameters:
  device: cuda
  random_state: 42
  n_cv: 1
  n_refit: 0
  n_repeats: 1
  n_ens: 1
  n_epochs: 256
  batch_size: 256
  predict_batch_size: 1024
  hidden_sizes: [256, 256, 256]
  act: selu
  use_parametric_act: true
  opt: adam
  lr: 0.04
  lr_sched: coslog4
  wd: 0.02
  wd_sched: flat_cos
  p_drop: 0.15
  p_drop_sched: flat_cos
  val_metric_name: cross_entropy
  use_ls: false
  use_early_stopping: false
  verbosity: 2

backend_controls:
  val_fraction: 0.0
  categorical_columns: explicit_by_name

project_policy:
  allow_silent_cpu_fallback: false
  class_weighting: false
  sample_weighting: false

input_contract:
  preprocessing_version: dataset_b_neural_preprocessing_v1
  representation: realmlp_native_19_columns
  raw_feature_count: 15
  semantic_feature_count: 19
  numerical_dtype: float32
  categorical_dtype: category
  external_scaler: false
  external_ohe: false

pilot:
  population: train_only
  sample_fraction: 0.20
  inner_stop_fraction: 0.20
  random_state: 42
  maximum_epochs: 256
  decision: fixed_epoch_from_pilot

threshold:
  candidates:
    start: 0.001
    stop: 0.999
    step: 0.001
    count: 999
  objective: maximize_balanced_accuracy
  tie_break: [minimum_absolute_distance_to_0.5, lower_threshold]

bootstrap:
  replicates: 1000
  indices: locked_existing_indices
  regenerate_indices: false

run_policy:
  run_id_pattern: realmlp_final_15f_<YYYYMMDD>_<NN>
  artifact_working_path: artifacts/dataset_b/realmlp/working/<run_id>
  artifact_final_path: artifacts/dataset_b/realmlp/final/<run_id>
  allow_overwrite: false
  allow_resume_model_state: false
  allow_historical_relabel: false
  outer_cv_folds: 5
  oof_required_coverage: exactly_once
  validation_prediction_passes: 1
  test_prediction_passes: 1
