schema_version: 1

target:
  name: y_approved
  source_column: action_taken
  eligible_values: [1, 2, 3]
  positive_values: [1, 2]
  negative_values: [3]
  forbidden_model_inputs: [action_taken]

datasets:
  dataset_a:
    status: locked
    purpose: bridge_rq1_rq2

    model_input_raw_columns:
      - applicant_race-1
      - applicant_race-2
      - applicant_race-3
      - applicant_race-4
      - applicant_race-5
      - applicant_sex
      - income
      - loan_amount
      - loan_purpose
      - lien_status
      - loan_type

    numerical_columns: [income, loan_amount]
    categorical_columns:
      - applicant_sex
      - loan_purpose
      - lien_status
      - loan_type

    multihot_groups:
      applicant_race:
        source_columns:
          - applicant_race-1
          - applicant_race-2
          - applicant_race-3
          - applicant_race-4
          - applicant_race-5

    explanation_groups:
      applicant_race:
        source: multihot_group:applicant_race
      applicant_sex:
        source: applicant_sex
      applicant_income:
        source: income
      loan_amount:
        source: loan_amount
      loan_purpose:
        source: loan_purpose
      lien_status:
        source: lien_status
      loan_type:
        source: loan_type

  dataset_b:
    status: final_feature_lock
    purpose: main_rq1_rq2_rq3
    canonical_feature_contract: dataset_b/feature_set_v1.yaml
    model_input_contract: dataset_b/feature_set_v1.yaml
    note: >-
      Dataset B final 15-field model inputs and audit columns must be read from
      the versioned contract. Do not reuse temporary-lock fitted state or the
      former Dataset B race-slot inputs.
